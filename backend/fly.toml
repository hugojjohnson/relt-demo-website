# fly.toml app configuration file generated for relt-demo-website on 2026-08-13T17:51:28+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'relt-demo-website'
primary_region = 'syd'
console_command = '/code/manage.py shell'

[build]
[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'
  DEBUG = 'False'
  ALLOWED_HOSTS = 'relt-demo-website.fly.dev'
  CORS_ALLOWED_ORIGINS = 'http://localhost:3000,https://relt-demo-platform.fly.dev'
  CORS_ALLOW_CREDENTIALS = 'True'
  CSRF_TRUSTED_ORIGINS = 'http://localhost:3000,https://relt-demo-platform.fly.dev'
  CSRF_COOKIE_SECURE = 'True'
  CSRF_COOKIE_SAMESITE = 'None'
  SESSION_COOKIE_SECURE = 'True'
  SESSION_COOKIE_SAMESITE = 'None'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
